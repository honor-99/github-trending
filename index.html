<!doctype html>
<html lang="zh-CN" data-skin="paper">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GitHub 热度追踪 · 榜单归档</title>
<meta name="description" content="GitHub Trending 每期快照归档：新上榜、持续热门、掉榜，加上话题聚合与潜力观察。" />
<link rel="stylesheet" href="assets/styles.css?v=6" />
</head>
<body>
<header class="topbar">
  <a class="brand" href="./">
    <span class="brand-mark">GH</span>
    <span class="brand-text">热度追踪</span>
  </a>
  <nav class="topnav">
    <a href="#rankCol" class="is-active" data-nav="list">榜单</a>
    <a href="#topics" data-nav="topics">话题</a>
    <a href="#potential" data-nav="potential">潜力</a>
    <a href="#data" id="dataLink">数据</a>
    <a id="repoLink" href="https://github.com/trending" target="_blank" rel="noopener">GitHub</a>
    <button class="skin-btn" id="skinToggle" type="button" aria-label="切换外观">外观 · 纸感</button>
  </nav>
</header>

<main class="shell" id="top">

  <section class="console-head">
    <div class="console-title">
      <p class="eyebrow">GITHUB TRENDING ARCHIVE</p>
      <h1>热度追踪</h1>
    </div>
    <div class="console-tools">
      <div class="segmented" role="tablist" aria-label="榜单周期">
        <button role="tab" data-period="daily" aria-selected="true">日榜</button>
        <button role="tab" data-period="weekly" aria-selected="false">周榜</button>
        <button role="tab" data-period="monthly" aria-selected="false">月榜</button>
      </div>
      <p class="console-status" id="controlsMeta"></p>
    </div>
  </section>

  <section class="kpis" id="kpis" aria-live="polite"></section>

  <p class="notice" id="notice" hidden></p>

  <div class="board-grid">

    <section class="col col--rank" id="rankCol">
      <header class="col-head">
        <span class="col-index">01</span>
        <h2>榜单动态</h2>
        <span class="col-hint">与上一期对比</span>
      </header>

      <section class="block" id="block-new" hidden>
        <div class="block-head">
          <div class="block-title">
            <h3>新上榜</h3>
            <span class="block-sub" id="newSub"></span>
          </div>
          <span class="block-count" id="newCount"></span>
        </div>
        <ol class="list" id="list-new"></ol>
      </section>

      <section class="block" id="block-hot" hidden>
        <div class="block-head">
          <div class="block-title">
            <h3>持续热门</h3>
            <span class="block-sub" id="hotSub"></span>
          </div>
          <span class="block-count" id="hotCount"></span>
        </div>
        <ol class="list" id="list-hot"></ol>
      </section>

      <section class="block" id="block-drop" hidden>
        <div class="block-head">
          <div class="block-title">
            <h3>掉榜</h3>
            <span class="block-sub" id="dropSub"></span>
          </div>
          <span class="block-count" id="dropCount"></span>
        </div>
        <ol class="list list--muted" id="list-drop"></ol>
      </section>

      <section class="block" id="block-empty" hidden>
        <p class="empty" id="emptyText"></p>
      </section>
    </section>

    <section class="col col--topics" id="topics" hidden>
      <header class="col-head">
        <span class="col-index">02</span>
        <h2>趋势话题</h2>
        <span class="col-hint" id="topicsSub"></span>
      </header>
      <div class="topic-list" id="topicList"></div>
      <p class="col-note" id="topicsNote"></p>
    </section>

    <section class="col col--potential" id="potential" hidden>
      <header class="col-head">
        <span class="col-index">03</span>
        <h2>潜力观察</h2>
        <span class="col-hint" id="potentialSub"></span>
      </header>
      <ol class="list" id="potentialList"></ol>
      <p class="col-note" id="potentialNote"></p>
    </section>

  </div>

  <footer class="foot">
    <p id="footSource"></p>
    <p class="foot-dim">
      数据源 GitHub Trending（匿名访问每次返回 9–14 条）· 快照由本机定时任务抓取后直接提交，无服务端。
      描述保留 GitHub 原文；点条目可看中文七段式解读（模型预生成并落盘，页面本身不调模型）。
    </p>
  </footer>
</main>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-backdrop" data-close></div>
  <aside class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
    <header class="drawer-head">
      <div class="drawer-head-main">
        <p class="eyebrow" id="drawerEyebrow">PROJECT NOTES</p>
        <h2 id="drawerTitle"></h2>
        <div class="meta" id="drawerMeta"></div>
      </div>
      <button class="drawer-close" data-close aria-label="关闭详情">✕</button>
    </header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>

<script src="assets/app.js?v=6"></script>
</body>
</html>
